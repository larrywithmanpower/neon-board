<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 深色圓角底 -->
  <rect width="512" height="512" rx="112" fill="#05010f"/>
  <!-- 三條霓虹光條（置中、留 maskable 安全邊） -->
  <g filter="url(#glow)">
    <rect x="128" y="176" width="256" height="40" rx="20" fill="#ff3df0"/>
    <rect x="128" y="240" width="180" height="40" rx="20" fill="#2dd4bf"/>
    <rect x="128" y="304" width="220" height="40" rx="20" fill="#ffd166"/>
  </g>
</svg>
